plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.probe.byd'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.probe.byd'
        minSdk 26
        // DiLink accepts APKs with targetSdk <= 33; 29 keeps legacy storage access simple
        targetSdk 29
        versionCode 4
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
